<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Seite nicht gefunden | Dirk Mathesius</title>
<meta name="robots" content="noindex, follow" />
<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<script>
(function(){try{var t=localStorage.getItem("dm-theme");
if(t==="dark"||(!t&&window.matchMedia("(prefers-color-scheme: dark)").matches)){
document.documentElement.classList.add("dark");}}catch(e){}})();
</script>
<style>
  body{background:#fff;margin:0;color:#222;font-family:Arial,Helvetica,sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;}
  .wrap{max-width:420px;padding:0 16px;}
  .brand img{width:50px;height:50px;border:0;margin-bottom:18px;}
  h1{font-size:15px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;margin:0 0 10px;}
  p{font-size:13px;color:#666;line-height:1.7;margin:0 0 22px;}
  a.book{background:#FF6600;color:#fff;text-decoration:none;font-size:11px;letter-spacing:.18em;
         text-transform:uppercase;padding:11px 20px;white-space:nowrap;display:inline-block;}
  a.book:hover{background:#e25c00;}
  html.dark body{background:#131110;color:#e8e4df;}
  html.dark p{color:#c2bbb3;}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="images/kreuz.jpg" alt="Fotograf Dirk Mathesius" /></div>
  <h1>404 &ndash; Seite nicht gefunden</h1>
  <p>Die aufgerufene Seite existiert nicht oder wurde verschoben.</p>
  <a class="book" href="/">Zur Startseite</a>
</div>
</body>
</html>
